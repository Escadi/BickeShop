<ion-toolbar>
  <ion-buttons slot="start">
    <ion-back-button default-href="#"></ion-back-button>
  </ion-buttons>
  <ion-title class="titulo">Añadir bicicleta</ion-title>
</ion-toolbar>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">add-bicycle</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="contenedoresInput">

    <form [formGroup]="bicycleForm" (ngSubmit)="createBicycle()">

      <!-- Marca -->
      <p>Marca</p>
      <ion-input fill="outline" placeholder="Ej: Montain Pro_22" formControlName="brand">
      </ion-input>
      <ion-note color="danger"
        *ngIf="getFormControl('brand')?.hasError('required') && getFormControl('brand')?.touched">
        La marca es obligatoria
      </ion-note>

      <!-- Modelo -->
      <p>Modelo</p>
      <ion-input fill="outline" placeholder="RX-200" formControlName="model">
      </ion-input>
      <ion-note color="danger"
        *ngIf="getFormControl('model')?.hasError('required') && getFormControl('model')?.touched">
        El modelo es obligatorio
      </ion-note>

      <!-- Precio (aún sin control en el TS) -->
      <p>Precio</p>
      <ion-input fill="outline" placeholder="€ 1500"></ion-input>

      <!-- Tipo -->
      <p>Tipo</p>
      <div class="selectorItems">
        <ion-select class="selector" interface="popover" placeholder="Montaña">
          <ion-select-option value="Mountain Bike">Mountain Bike</ion-select-option>
          <ion-select-option value="Urbanas">Urbanas</ion-select-option>
          <ion-select-option value="Plegables">Plegables</ion-select-option>
          <ion-select-option value="BMX">BMX</ion-select-option>
          <ion-select-option value="Gravel">Gravel</ion-select-option>
          <ion-select-option value="Hibridas">Hibridas</ion-select-option>
          <ion-select-option value="Fixies">Fixies</ion-select-option>
          <ion-select-option value="Ruteras y Pisteras">Ruteras y Pisteras</ion-select-option>
        </ion-select>
      </div>

      <!-- Imagen -->
      <div class="imageBox">
        <label for="file-input" class="upload-box">
          <img src="https://cdn-icons-png.flaticon.com/512/1829/1829586.png" alt="icono">
          <span>Subir imagen</span>
        </label>
        <input type="file" id="file-input" accept="image/*" onchange="previewImage(event)">
        <br>
        <img id="preview" src="" alt="Vista previa"
          style="max-width: 300px; display: none; border: 1px solid #ccc; border-radius: 8px; margin-top: 10px;">
      </div>

      <!-- Botón de submit -->
      <ion-button expand="block" fill="clear" class="BtnAdd" type="submit" [disabled]="!bicycleForm.valid">
        Agregar
      </ion-button>
    </form>
  </div>



</ion-content>
