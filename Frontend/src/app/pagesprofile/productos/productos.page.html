<!-- 🔹 Cabecera principal -->
<ion-header>
  <ion-toolbar>
    <ion-title>Gestionar productos</ion-title>

    <!-- 🔹 Icono de usuario que abre el menú -->
    <ion-buttons slot="end">
      <ion-button id="user-menu-trigger">
        <ion-icon name="person-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- 🔹 Popover del menú de usuario -->
<ion-popover trigger="user-menu-trigger" side="bottom" alignment="end">
  <ng-template>
    <ion-content>
      <ion-list>
        <ion-item button>Mi perfil</ion-item>
        <ion-item button>Gestión de usuarios</ion-item>
        <ion-item button>Cerrar sesión</ion-item>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-popover>

<!-- 🔹 Contenido principal -->
<ion-content>
  <ion-list lines="none" class="custom-list">

    <ion-item button detail routerLink="/add-bicycle">
      <ion-icon name="add-circle-outline" slot="start" class="icon green"></ion-icon>
      <ion-label>Añadir nueva bicicleta</ion-label>
    </ion-item>

    <ion-item button detail routerLink="/upload-bicycle">
      <ion-icon name="pencil-outline" slot="start" class="icon green"></ion-icon>
      <ion-label>Editar información de bicicleta</ion-label>
    </ion-item>

    <ion-item button detail routerLink="/upload-images">
      <ion-icon name="image-outline" slot="start" class="icon green"></ion-icon>
      <ion-label>Subir imágenes</ion-label>
    </ion-item>

    <ion-item button detail routerLink="/manage-inventory">
      <ion-icon name="albums-outline" slot="start" class="icon green"></ion-icon>
      <ion-label>Gestionar inventario</ion-label>
    </ion-item>

  </ion-list>
</ion-content>
