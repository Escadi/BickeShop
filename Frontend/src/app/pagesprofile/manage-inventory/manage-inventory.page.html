<ion-toolbar>
  <ion-buttons slot="start">
    <ion-back-button default-href="#"></ion-back-button>
  </ion-buttons>
  <ion-title class="titulo">Gestionar Inventario</ion-title>
</ion-toolbar>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">manage-inventory</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-searchbar animated="true" placeholder="Buscar Bicicleta.."></ion-searchbar>
 <ion-list lines="none" class="list">
  <ion-item class="miLista" *ngFor="let b of bicycle">
    
   
    <ion-avatar slot="start">
      <img [src]="b.image || 'assets/Monty_KX8_26-scaled.jpg'">
    </ion-avatar>

    
    <ion-label class="listLabel">
      <p class="id">{{b.id}}</p>
      <h1 class="marca">{{ b.brand }}</h1>
      <p class="model">{{ b.model }}</p>
      <p class="stock">Stock: 10</p>
    </ion-label>

    
    <ion-button 
      slot="end" 
      (click)="deleteBicycle(b.id)" 
      fill="clear" 
      color="danger"
      class="btnEliminar">
      <ion-icon name="trash-outline"></ion-icon>
    </ion-button>

  </ion-item>
</ion-list>

</ion-content>
