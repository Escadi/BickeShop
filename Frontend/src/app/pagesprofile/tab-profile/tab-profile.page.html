<ion-header [translucent]="true">
 <ion-toolbar>
<ion-buttons slot="end" id="user-menu-trigger" >
    <ion-avatar slot="end" class="avatar">
      <img src="assets/usuario.png" alt="Avatar del usuario">
    </ion-avatar>
  </ion-buttons>
  </ion-toolbar>

</ion-header>

<ion-content [fullscreen]="true">
 
  <ion-tabs>
    <ion-tab-bar slot="bottom" class="customIcon">
      <ion-tab-button tab="productos">
        <ion-icon name="home"></ion-icon>
        <ion-label>Productos</ion-label>
        
      </ion-tab-button>

      <ion-tab-button tab="pedidos">
        <ion-icon name="menu-outline"></ion-icon>
        <ion-label>Pedidos</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="clientes">
        <ion-icon name="card-outline"></ion-icon>
        <ion-label>Clientes</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="ajustes">
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>Ajustes</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-content>
