<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="#"></ion-back-button>
    </ion-buttons>
    <ion-title class="titulo">Editar bicicleta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Editar bicicleta</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-searchbar
    debounce="300"
    animated="true"
    placeholder="Código, Marca, Modelo ...."
    (ionInput)="filteredBicycle($event)">
  </ion-searchbar>

  <ion-list lines="none" class="list">
    <ion-item class="miLista" *ngFor="let b of filtered">
      <ion-label class="listLabel">
        <p class="id">{{ b.id }}</p>
        <h1 class="marca">{{ b.brand }}</h1>
        <p class="model">{{ b.model }}</p>
      </ion-label>

      <ion-button
        slot="end"
        fill="clear"
        class="btnEditar"
        (click)="openModal(b.id)">
        <ion-icon name="create-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

</ion-content>

<!-- ⚠️ El modal va FUERA del ion-content -->
<ion-modal [isOpen]="isModalOpen" (didDismiss)="closeModal()" class="custom-modal">
  <ng-template>
    
      <ion-toolbar>
        <ion-buttons slot="start">
      <ion-back-button default-href="#"></ion-back-button>
    </ion-buttons>
        <ion-title>Editar Bicicleta</ion-title>
      </ion-toolbar>
    

    <ion-content class="custom-modal-content">
      <ion-item lines="none">
        <ion-label position="stacked">Marca</ion-label>
        <ion-input [(ngModel)]="selectedBike.brand"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Modelo</ion-label>
        <ion-input [(ngModel)]="selectedBike.model"></ion-input>
      </ion-item>

      <ion-button expand="block" fill="clear" (click)="updateBike()">Actualizar</ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
