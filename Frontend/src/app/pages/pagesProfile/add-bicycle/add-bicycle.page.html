<ion-toolbar>
  <ion-buttons slot="start">
    <ion-back-button default-href="#"></ion-back-button>
  </ion-buttons>
  <ion-title class="titulo">Añadir bicicleta</ion-title>
</ion-toolbar>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">add-bicycle</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="contenedoresInput">
    <p>Marca</p>
    <ion-input fill="outline" placeholder="Ej: Montain Pro_22"></ion-input>
    <p>Modelo</p>
    <ion-input fill="outline" placeholder="RX-200"></ion-input>
    <p>Precio</p>
    <ion-input fill="outline" placeholder="€ 1500"></ion-input>
    <p>Tipo</p>
    <ion-item>
      <ion-select interface="popover" placeholder="Montaña">
        <ion-select-option value="apples">Apples</ion-select-option>
        <ion-select-option value="oranges">Oranges</ion-select-option>
        <ion-select-option value="bananas">Bananas</ion-select-option>
      </ion-select>
    </ion-item>
  </div>


  <ion-button class="BtnAdd" fill="clean">Agregar</ion-button>
</ion-content>
