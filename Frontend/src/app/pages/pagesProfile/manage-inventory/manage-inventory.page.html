<ion-toolbar>
  <ion-buttons slot="start">
    <ion-back-button default-href="#"></ion-back-button>
  </ion-buttons>
  <ion-title class="titulo">Gestionar Inventario</ion-title>
</ion-toolbar>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">manage-inventory</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list lines="none" class="list">
    <ion-item class="miLista" *ngFor="let b of bicycle">
      <ion-label class="listLabel">
        <h1>{{b.brand}}</h1>
        <p>{{b.model}}</p>
        <ion-button (click)="deleteBicycle(b.id)" fill="clear" class="btnEliminar">
          <ion-icon name="trash-outline"></ion-icon>
        </ion-button>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
