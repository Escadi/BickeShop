<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Catalogo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Catalogo</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-searchbar animated="true" placeholder="Buscar bicicleta" class="findCycle"></ion-searchbar>

  <ion-list class="list">
    <ion-item class="miLista" *ngFor="let b of bicycles" >
      <ion-label class="listLabel">
        <h1>{{b.brand}}</h1>
        <p>{{b.model}}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
